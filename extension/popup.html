<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 400px; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: #1F2937; background: #F4F6FA; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #fff; border-bottom: 1px solid #E3E7EE; }
  header img { width: 22px; height: 22px; }
  header h1 { font-size: 15px; margin: 0; flex: 1; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6B7280; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9CA3AF; }
  .dot.on { background: #16A34A; } .dot.off { background: #DC2626; }
  main { padding: 12px 14px; }
  .primary { width: 100%; border: 0; border-radius: 7px; background: #2563EB; color: #fff; font: 600 13px "Segoe UI", sans-serif; padding: 9px; cursor: pointer; }
  .primary:hover { background: #1D4ED8; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #6B7280; margin: 14px 0 6px; display: flex; justify-content: space-between; }
  h2 a { text-transform: none; letter-spacing: 0; color: #2563EB; cursor: pointer; font-weight: 400; }
  .list { background: #fff; border: 1px solid #E3E7EE; border-radius: 8px; max-height: 260px; overflow: auto; }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #F1F3F7; }
  .row:last-child { border-bottom: 0; }
  .tag { flex: none; font: 700 10px/1 "Segoe UI", sans-serif; padding: 3px 5px; border-radius: 4px; background: #DBEAFE; color: #1D4ED8; text-transform: uppercase; }
  .tag.audio { background: #DCFCE7; color: #15803D; }
  .name { flex: 1; min-width: 0; }
  .name div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name small { color: #6B7280; }
  .row button { flex: none; border: 1px solid #C7D2FE; background: #EEF2FF; color: #1D4ED8; border-radius: 6px; padding: 5px 9px; cursor: pointer; font: 600 12px "Segoe UI", sans-serif; }
  .row button:hover { background: #E0E7FF; }
  .row button:disabled { opacity: .5; cursor: default; }
  .empty { padding: 14px; color: #6B7280; text-align: center; }
  details { margin-top: 14px; background: #fff; border: 1px solid #E3E7EE; border-radius: 8px; padding: 8px 10px; }
  summary { cursor: pointer; font-weight: 600; }
  label { display: block; margin-top: 9px; color: #374151; }
  input[type=text], input[type=number] { width: 100%; margin-top: 3px; padding: 6px 7px; border: 1px solid #D1D5DB; border-radius: 6px; font: inherit; }
  .check { display: flex; gap: 7px; align-items: center; }
  .hint { color: #6B7280; font-size: 11px; margin-top: 8px; }
  .toast { position: fixed; left: 14px; right: 14px; bottom: 10px; background: #111827; color: #fff; padding: 8px 10px; border-radius: 7px; display: none; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>TurboDM</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">kontrol ediliyor…</span></div>
  </header>
  <main>
    <button class="primary" id="best">Bu sayfadaki videoyu indir</button>

    <h2>Yakalanan medya <a id="clear">temizle</a></h2>
    <div class="hint" id="subNote" style="margin:0 0 6px"></div>
    <div class="list" id="list"><div class="empty">Henüz bir şey yakalanmadı. Videoyu oynatmayı deneyin.</div></div>

    <details>
      <summary>Ayarlar</summary>
      <label>Uygulama portu<input type="number" id="port" min="1024" max="65535"></label>
      <label class="check"><input type="checkbox" id="intercept"> Tarayıcı indirmelerini TurboDM'e devret</label>
      <label class="check"><input type="checkbox" id="showButton"> Videoların üzerinde indirme butonu göster</label>
      <label>Devredilecek uzantılar<input type="text" id="exts"></label>
      <label>Listede olmasa da şu boyutun üstündekileri devret (KB)<input type="number" id="minSizeKB" min="0"></label>
      <div class="hint">Uygulama kapalıyken indirmeler normal şekilde tarayıcıda yapılır. DRM korumalı (Netflix, Disney+ vb.) içerikler indirilemez.</div>
    </details>
  </main>
  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
